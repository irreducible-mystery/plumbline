name: norms
on: [push, pull_request]
jobs:
  freeze-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the linter reads every past NORMS.md; a shallow clone fails it
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/check_norm_ids.py
